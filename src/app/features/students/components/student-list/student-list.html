<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this student?"
  header="Delete Student"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="student-list">
  <app-table
    key="student"
    [data]="students()"
    [config]="tableConfig"
    [loading]="loading()"
    (onAdd)="onClick()"
    (onView)="onView($event)"
    (onEdit)="onClick($event)"
    (onDelete)="confirmDelete($event)"
  />
</div>
