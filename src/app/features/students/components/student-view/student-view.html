<!--TODO: Make this component reusable-->
<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this student?"
  header="Delete Student"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="max-w-full w-[1100px] p-2.5">
  @if (loading()) {
    <div class="flex items-center justify-center w-full h-full">
      <svg class="spinner" width="65px" height="65px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
        <circle class="path" fill="none" stroke-width="6" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
      </svg>
    </div>
  } @else {
    <div class="form-card bg-white-500 mb-5 ">
<!--      <div class="section-title flex">-->
<!--        <span class="section-badge flex w-5.5 h-5.5 text-white bg-indigo-950">1</span>-->
<!--        <h2 class="m-0 text-indigo-600">Student Information</h2>-->
<!--      </div>-->

      <div class="field-grid grid">
        <div class="field">
          <label>Teacher ID</label>
          <input [value]="student()?.userId" disabled/>
        </div>

        <div class="field">
          <label>Full Name: </label>
          <input [value]="student()?.fullName" disabled/>
        </div>

        <div class="field">
          <label>Registration Number: </label>
          <input [value]="student()?.registrationNumber" disabled/>
        </div>

        <div class="field">
          <label>Class: </label>
          <input [value]="className()" disabled/>
        </div>

        <div class="field">
          <label>Date Of Admission: </label>
          <input [value]="student()?.dateOfAdmission?.substring(0,10)" disabled/>
        </div>

        <div class="field">
          <label>Email: </label>
          <input [value]="student()?.email" disabled/>
        </div>


        <div class="field">
          <label>Date Of Birth: </label>
          <input [value]="student()?.dob?.substring(0,10)" disabled/>
        </div>

        <div class="field">
          <label>Gender: </label>
          <input [value]="student()?.gender" disabled/>
        </div>

        <div class="field">
          <label>Phone Number: </label>
          <input [value]="student()?.phone" disabled/>
        </div>

        <div class="field">
          <label>Address: </label>
          <input [value]="student()?.address" disabled/>
        </div>

        <div class="field">
          <label>Blood Group: </label>
          <input [value]="student()?.bloodGroup" disabled/>
        </div>

        <div class="field">
          <label>Orphan Student: </label>
          <input [value]="student()?.orphanStudent" disabled/>
        </div>

        <div class="field">
          <label>Religion: </label>
          <input [value]="student()?.religion" disabled/>
        </div>

        <div class="field">
          <label>Guardian: </label>
          <input [value]="student()?.guardian" disabled/>
        </div>

        <div class="field">
          <label>Guardian Name: </label>
          <input [value]="student()?.guardianName" disabled/>
        </div>

        <div class="field">
          <label>Guardian NationalId: </label>
          <input [value]="student()?.guardianNationalId" disabled/>
        </div>

        <div class="field">
          <label>Guardian Phone Number: </label>
          <input [value]="student()?.guardianPhone" disabled/>
        </div>

        <div class="field">
          <label>Guardian Email: </label>
          <input [value]="student()?.guardianEmail" disabled/>
        </div>

        <div class="field">
          <label>Guardian Address: </label>
          <input [value]="student()?.guardianAddress" disabled/>
        </div>

        <div class="field">
          <label>Guardian Profession: </label>
          <input [value]="student()?.guardianProfession" disabled/>
        </div>

        <div class="field">
          <label>Guardian Income: </label>
          <input [value]="student()?.guardianIncome" disabled/>
        </div>
      </div>
    </div>

    <div class="student-action flex">
      <p-button [outlined]="true" label="Edit" icon="pi pi-pencil" (click)="onEdit(student()!)"/>
      <p-button [outlined]="true" label="Delete" icon="pi pi-trash" severity="danger"
                (click)="deleteStudent(student()!)"/>
    </div>
  }
</div>
