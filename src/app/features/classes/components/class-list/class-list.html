<!--TODO: Make this component reusable-->
<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this Class?"
  header="Delete Class"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="class-list">
  <app-table
    key="class"
    [data]="classes()"
    [config]="tableConfig"
    [loading]="loading()"
    (onAdd)="onClick()"
    (onView)="onView($event)"
    (onEdit)="onClick($event)"
    (onDelete)="confirmDelete($event)"
  />
</div>
