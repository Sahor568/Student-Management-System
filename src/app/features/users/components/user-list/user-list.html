<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this User?"
  header="Delete User"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="user-list">
  <app-table
    key="user"
    [data]="users()"
    [config]="tableConfig"
    [loading]="loading()"
    (onAdd)="onClick()"
    (onDelete)="confirmDelete($event)"
    (onEdit)="onClick($event)"
    (onView)="onView($event)"
  />
</div>
