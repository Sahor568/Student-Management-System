<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this user?"
  header="Delete User"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="max-w-full w-[1100px] p-2.5">
  @if (loading()) {
    <div class="flex items-center justify-center w-full h-full">
      <svg class="spinner" width="65px" height="65px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
        <circle class="path" fill="none" stroke-width="6" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
      </svg>
    </div>

  } @else {
    <div class="form-card bg-white-500 mb-5 ">
      <!--      <div class="section-title flex">-->
      <!--        <span class="section-badge flex w-5.5 h-5.5 text-white bg-indigo-950">1</span>-->
      <!--        <h2 class="m-0 text-indigo-600">Teacher Information</h2>-->
      <!--      </div>-->

      <div class="field-grid grid">
        <div class="field">
          <label>Full Name: </label>
          <input [value]="user()?.fullName" disabled/>
        </div>

        <div class="field">
          <label>Email: </label>
          <input [value]="user()?.email" disabled/>
        </div>

        <div class="field">
          <label>Password: </label>
          <input [value]="user()?.password" disabled/>
        </div>
      </div>

      <div class="user-action flex">
        <p-button [outlined]="true" label="Edit" icon="pi pi-pencil" (click)="onEdit(user()!)"/>
        <p-button [outlined]="true" label="Delete" icon="pi pi-trash" severity="danger"
                  (click)="deleteUser(user()!)"/>
      </div>
    </div>
  }
</div>
