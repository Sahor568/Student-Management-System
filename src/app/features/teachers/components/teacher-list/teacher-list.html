<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this teacher?"
  header="Delete Teacher"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="teacher-list">
  <app-table
    key="teacher"
    [data]="teachers()"
    [config]="tableConfig"
    [loading]="loading()"
    (onDelete)="confirmDelete($event)"
    (onEdit)="onEdit($event)"
    (onView)="onView($event)"
  />
</div>
