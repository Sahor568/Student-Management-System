<app-confirm-dialog
  #confirmDialog
  message="Are you sure you want to delete this teacher?"
  header="Delete Teacher"
  acceptLabel="Delete"
  acceptSeverity="danger"
  (accept)="onDeleteAccept()"
/>

<div class="max-w-full w-[1100px] p-2.5">
  @if (loading()) {
    <div class="flex items-center justify-center w-full h-full">
      <svg class="spinner" width="65px" height="65px" viewBox="0 0 66 66" xmlns="http://www.w3.org/2000/svg">
        <circle class="path" fill="none" stroke-width="6" stroke-linecap="round" cx="33" cy="33" r="30"></circle>
      </svg>
    </div>

  } @else {
    <div class="form-card bg-white-500 mb-5 ">
<!--      <div class="section-title flex">-->
<!--        <span class="section-badge flex w-5.5 h-5.5 text-white bg-indigo-950">1</span>-->
<!--        <h2 class="m-0 text-indigo-600">Teacher Information</h2>-->
<!--      </div>-->

      <div class="field-grid grid">

        <div class="field">
          <label>Full Name</label>
          <input [value]="teacher()?.fullName" disabled/>
        </div>

        <div class="field">
          <label>Email</label>
          <input [value]="teacher()?.email" disabled/>
        </div>

        <div class="field">
          <label>Phone Number</label>
          <input [value]="teacher()?.phone" disabled/>
        </div>

        <div class="field">
          <label>Status</label>
          <input [value]="teacher()?.status" disabled/>
        </div>

        <div class="field">
          <label>Monthly Salary</label>
          <input [value]="teacher()?.monthlySalary" disabled/>
        </div>

        <div class="field">
          <label>National ID</label>
          <input [value]="teacher()?.nationalId" disabled/>
        </div>

        <div class="field">
          <label>Education</label>
          <input [value]="teacher()?.education" disabled/>
        </div>

        <div class="field">
          <label>Experience</label>
          <input [value]="teacher()?.experience" disabled/>
        </div>

        <div class="field">
          <label>Gender</label>
          <input [value]="teacher()?.gender" disabled/>
        </div>

        <div class="field">
          <label>Religion</label>
          <input [value]="teacher()?.religion" disabled/>
        </div>

        <div class="field">
          <label>Blood Group</label>
          <input [value]="teacher()?.bloodGroup" disabled/>
        </div>

        <div class="field">
          <label>Date Of Birth</label>
          <input [value]="teacher()?.dob?.substring(0, 10)" disabled/>
          <!-- substring(0, 10) extracts 10 digit from the date -->
        </div>

        <div class="field">
          <label>Address</label>
          <input [value]="teacher()?.address" disabled/>
        </div>
      </div>
    </div>

    <div class="teacher-action flex">
      <p-button [outlined]="true" label="Edit" icon="pi pi-pencil" (click)="onEdit(teacher()!)"/>
      <p-button [outlined]="true" label="Delete" icon="pi pi-trash" severity="danger"
                (click)="deleteTeacher(teacher()!)"/>
    </div>
  }
</div>
